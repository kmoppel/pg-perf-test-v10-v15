---
# Playbook: provision a Debian host for pg-perf-test-v10-v15
#
# 1) Installs rsync + postgresql-19 (adds the "19" component to the
#    pgdg.sources deb822 file first, since that's required for the
#    postgresql-19 package to be resolvable).
# 2) Copies the whole pg-perf-test-v10-v15 project directory to the
#    remote host, owned by the "postgres" user.
# 3) Creates a "logs" directory in test "home" i.e. pg-perf-test-v10-v15
#
# 4) Reserves 40GB of huge pages (2MB each) if the host has > 190GB RAM,
#    persisted in /etc/sysctl.d/99-hugepages.conf (applied on boot by
#    systemd-sysctl on Debian 13 / Ubuntu 26.04)
# 5) Starts run_pgbench_testset.sh in a detached tmux session named "bench"
#    (as postgres; the session stays open after the script finishes)
#
# Usage:
#   PS! Assuming CWD is Github root for pg-perf-test-v10-v15
#   ansible-playbook -i $HOST_IP, -u pgspotops ansible/perftest-prep.yml
#
- name: Set up host for pg-perf-test-v10-v15 testing under 'postgres' user
  hosts: all
  become: true
  vars:
    # Path (relative to this playbook, or absolute) to the project folder
    # to copy to the remote host. Defaults to the sibling checkout
    # mentioned in the task description.
    project_src_dir: "../../pg-perf-test-v10-v15"
    project_dest_dir: "{{ postgres_home }}/pg-perf-test-v10-v15"
    postgres_home: /var/lib/postgresql
    pgdg_sources_file: /etc/apt/sources.list.d/pgdg.sources

  tasks:
    - name: Ensure postgresql-common package is installed
      ansible.builtin.apt:
        name: postgresql-common
        state: present
        update_cache: true

    - name: Check whether pgdg.sources already exists
      ansible.builtin.stat:
        path: "{{ pgdg_sources_file }}"
      register: pgdg_sources_stat

    - name: Set up Postgres PGDG apt repository
      ansible.builtin.command: /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
      when: not pgdg_sources_stat.stat.exists

    - name: Ensure the "19" component is present in pgdg.sources
      ansible.builtin.replace:
        path: "{{ pgdg_sources_file }}"
        # Matches a "Components:" line that does not already contain "19"
        # as a standalone token, and appends " 19" to it.
        regexp: '^(Components:(?!.*\b19\b).*)$'
        replace: '\1 19'
      register: pgdg_components_updated

    - name: Update apt cache after enabling the "19" component
      ansible.builtin.apt:
        update_cache: true
      when: pgdg_components_updated.changed

    - name: Install rsync and to-be-tested PG versions
      ansible.builtin.apt:
        name:
          - rsync
          - tmux
          - postgresql-18
          - postgresql-19
        state: present
        update_cache: true

    - name: Ensure postgresql service is stopped and disabled
      ansible.builtin.service:
        name: postgresql
        state: stopped
        enabled: false

    - name: Activate ~40GB of huge pages for SB on hosts with > 190GB RAM
      ansible.posix.sysctl:
        name: vm.nr_hugepages
        value: "20000"
        sysctl_file: /etc/sysctl.d/99-hugepages.conf
        state: present
        sysctl_set: true
        reload: true
      when: ansible_memtotal_mb > 190 * 1024

    - name: Ensure destination directory exists and is owned by postgres
      ansible.builtin.file:
        path: "{{ project_dest_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0755"

    - name: Copy project directory contents to the remote host
      ansible.posix.synchronize:
        src: "{{ project_src_dir }}/"
        dest: "{{ project_dest_dir }}/"
        recursive: true
        delete: false
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=logs/"
          - "--chown=postgres:postgres"
      become: true
      become_user: root

    - name: Ensure copied files are owned by postgres (fallback if --chown unsupported)
      ansible.builtin.file:
        path: "{{ project_dest_dir }}"
        owner: postgres
        group: postgres
        recurse: true

    - name: Create "log" directory in postgres user's home
      ansible.builtin.file:
        path: "{{ project_dest_dir }}/logs"
        state: directory
        owner: postgres
        group: postgres
        mode: "0755"

    - name: Check that ~/.connstr_resultsdb exists on the Ansible host
      ansible.builtin.stat:
        path: ~/.connstr_resultsdb
      delegate_to: localhost
      become: false
      register: connstr_file

    - name: Abort if ~/.connstr_resultsdb is missing
      ansible.builtin.assert:
        that: connstr_file.stat.exists
        fail_msg: "~/.connstr_resultsdb not found on the Ansible host"

    - name: Set CONNSTR_RESULTSDB in run_pgbench_testset.sh from ~/.connstr_resultsdb
      ansible.builtin.lineinfile:
        path: "{{ project_dest_dir }}/run_pgbench_testset.sh"
        regexp: '^CONNSTR_RESULTSDB='
        line: "CONNSTR_RESULTSDB='{{ (lookup('ansible.builtin.file', '~/.connstr_resultsdb') | trim) | replace(\"'\", \"'\\\\''\") }}'"
      no_log: true

    - name: Check whether tmux session "bench" already exists
      ansible.builtin.command: tmux has-session -t bench
      become: true
      become_user: postgres
      register: bench_session
      changed_when: false
      failed_when: false

    - name: Start run_pgbench_testset.sh in tmux session "bench"
      # "exec bash" keeps the session alive after the script finishes
      ansible.builtin.command: >-
        tmux new-session -d -s bench -c {{ project_dest_dir }}
        "bash ./run_pgbench_testset.sh 2>&1 | tee run.log; echo; echo run_pgbench_testset.sh exited with ${PIPESTATUS[0]}; exec bash"
      environment:
        USER: postgres
        SHELL: /bin/bash
      become: true
      become_user: postgres
      when: bench_session.rc != 0
